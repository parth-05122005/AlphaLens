name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alphalens
          POSTGRES_PASSWORD: alphalens
          POSTGRES_DB: alphalens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphalens -d alphalens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests use eager Celery + an in-memory cache (alphalens.settings_test), so no Redis service is needed.
      DATABASE_URL: postgres://alphalens:alphalens@localhost:5432/alphalens
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
