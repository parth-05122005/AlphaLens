# Local development stack. Frontend runs outside Docker with `npm run dev`.
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgres://alphalens:alphalens@db:5432/alphalens
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alphalens
      POSTGRES_PASSWORD: alphalens
      POSTGRES_DB: alphalens
    ports:
      - "${DB_HOST_PORT:-5433}:5432"  # host 5433 avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphalens -d alphalens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"  # override if another stack already holds 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A alphalens worker -l info --concurrency=2

  beat:
    <<: *backend
    command: celery -A alphalens beat -l info --schedule /tmp/celerybeat-schedule

  flower:
    <<: *backend
    command: celery -A alphalens flower --port=5555
    ports:
      - "5555:5555"

volumes:
  pgdata:
